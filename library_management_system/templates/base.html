
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookNest Library{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <a class="brand" href="{{ url_for('home') }}">📚 BookNest</a>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Dashboard</a>
            <a href="{{ url_for('view_books') }}">Books</a>
            <a href="{{ url_for('students') }}">Students</a>
            <a href="{{ url_for('issue') }}">Issue Book</a>
            <a href="{{ url_for('issued_books') }}">Issue Records</a>
        </div>
    </nav>

    <main class="container">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="notice {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}

    </main>

    <footer>
        BookNest · Library Management System
    </footer>

</body>
</html>
